<!DOCTYPE html>
<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vía Global — Portal del Cliente</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#1D9E75;--td:#0F6E56;--tdd:#085041;--tl:#E1F5EE;
  --gold:#BA7517;--gl:#FAEEDA;
  --bg:#f4f3ef;--w:#fff;--brd:#e2e0da;--brd2:#cbc8bf;
  --tx:#1a1a18;--mt:#6b6a66;--ht:#a8a6a0;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;display:flex;flex-direction:column;font-size:14px}
nav{background:var(--tdd);padding:.7rem 1.25rem;display:flex;align-items:center;gap:12px;flex-shrink:0}
nav img{height:36px;width:auto;filter:brightness(0) invert(1)}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.nav-code{font-size:12px;color:rgba(255,255,255,.7)}
.nav-code span{color:#fff;font-weight:500}
.btn-salir{padding:4px 10px;border:1px solid rgba(255,255,255,.2);border-radius:6px;background:transparent;color:rgba(255,255,255,.7);font-family:'DM Sans',sans-serif;font-size:11px;cursor:pointer}
.btn-salir:hover{background:rgba(255,255,255,.1);color:#fff}

/* LOGIN */
.login-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:2rem}
.login-card{background:var(--w);border-radius:16px;border:1px solid var(--brd);padding:2rem;width:100%;max-width:360px;text-align:center}
.login-card img{height:60px;width:auto;margin-bottom:1.5rem}
.login-card h2{font-family:'DM Serif Display',serif;font-size:22px;font-weight:400;margin-bottom:6px}
.login-card p{font-size:13px;color:var(--mt);margin-bottom:1.5rem;line-height:1.5}
.code-input{width:100%;padding:12px;border:1.5px solid var(--brd);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:16px;color:var(--tx);outline:none;text-align:center;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px;transition:border-color .2s}
.code-input:focus{border-color:var(--teal)}
.btn-entrar{width:100%;padding:12px;background:var(--tdd);color:#fff;border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:background .15s}
.btn-entrar:hover{background:var(--td)}
.login-err{font-size:12px;color:#E24B4A;margin-top:8px;display:none}

/* APP */
.app{flex:1;display:none;flex-direction:column;min-height:0;overflow:hidden}
.app.on{display:flex}
.tabs{background:var(--tdd);display:flex;padding:0 1.25rem;border-top:1px solid rgba(255,255,255,.06);flex-shrink:0}
.tab{padding:0 1rem;height:44px;display:flex;align-items:center;font-size:13px;color:rgba(255,255,255,.55);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap}
.tab:hover{color:rgba(255,255,255,.85)}
.tab.on{color:#fff;border-bottom-color:#fff}

/* CHAT */
.chat-view{flex:1;display:none;flex-direction:column;min-height:0;overflow:hidden}
.chat-view.on{display:flex}
.chat-main{display:flex;flex:1;min-height:0;overflow:hidden}
.sidebar{width:210px;background:var(--w);border-right:1px solid var(--brd);overflow-y:auto;flex-shrink:0}
.sb-sec{padding:.8rem 1rem;border-bottom:1px solid var(--brd)}
.sb-lbl{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.07em;color:var(--ht);margin-bottom:8px}
.step{display:flex;align-items:center;gap:7px;padding:4px 0;font-size:12px;color:var(--mt)}
.step-dot{width:7px;height:7px;border-radius:50%;background:var(--brd2);flex-shrink:0}
.step.cur{color:var(--tx);font-weight:500}
.step.cur .step-dot{background:var(--gold)}
.step.done .step-dot{background:var(--teal)}
.doc{display:flex;align-items:flex-start;gap:7px;padding:5px 0;font-size:12px;border-bottom:1px solid var(--brd)}
.doc:last-child{border:none}
.doc-box{width:14px;height:14px;border:1.5px solid var(--brd2);border-radius:3px;flex-shrink:0;margin-top:1px}

/* CHAT COL */
.chat-col{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.chat-hdr{padding:.8rem 1.25rem;background:var(--w);border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:10px}
.agent-av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;border:2px solid var(--brd)}
.agent-info p{font-size:13px;font-weight:500}
.agent-info small{font-size:11px;color:var(--mt);display:flex;align-items:center;gap:4px}
.saved-ind{margin-left:auto;font-size:11px;color:var(--teal);opacity:0;transition:opacity .3s}
.saved-ind.on{opacity:1}
.messages{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px;max-width:86%;animation:fadeUp .2s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.msg.agent{align-self:flex-start}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg-av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;margin-top:2px;border:1.5px solid var(--brd)}
.bubble{padding:10px 14px;border-radius:14px;font-size:13px;line-height:1.6}
.msg.agent .bubble{background:var(--w);border:1px solid var(--brd);border-radius:3px 14px 14px 14px}
.msg.user .bubble{background:var(--tdd);color:#fff;border-radius:14px 3px 14px 14px}
.bubble ul{padding-left:1rem;margin-top:3px}
.bubble li{margin-bottom:2px}
.msg-time{font-size:10px;color:var(--ht);margin-top:3px;padding:0 4px}
.msg.user .msg-time{text-align:right}
.typing-row{display:flex;gap:8px;align-self:flex-start;animation:fadeUp .2s ease}
.typing-bub{padding:12px 16px;border-radius:3px 14px 14px 14px;background:var(--w);border:1px solid var(--brd);display:flex;gap:4px;align-items:center}
.typing-bub span{width:6px;height:6px;border-radius:50%;background:var(--ht);animation:bounce 1.3s infinite}
.typing-bub span:nth-child(2){animation-delay:.2s}
.typing-bub span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
.sys-note{text-align:center;font-size:11px;color:var(--ht);padding:3px 0}
.quick-btns{padding:.5rem 1rem;display:flex;gap:5px;flex-wrap:wrap;border-top:1px solid var(--brd);background:var(--bg)}
.qbtn{padding:5px 12px;border:1px solid var(--brd2);border-radius:14px;background:var(--w);font-family:'DM Sans',sans-serif;font-size:11px;color:var(--mt);cursor:pointer;transition:all .15s;white-space:nowrap}
.qbtn:hover{border-color:var(--teal);color:var(--td);background:var(--tl)}
.input-row{padding:.75rem 1rem;background:var(--w);border-top:1px solid var(--brd);display:flex;gap:7px;align-items:flex-end}
.input-row textarea{flex:1;padding:9px 13px;border:1px solid var(--brd);border-radius:20px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--tx);resize:none;outline:none;max-height:100px;line-height:1.5;transition:border-color .2s;background:var(--bg)}
.input-row textarea:focus{border-color:var(--teal);background:var(--w)}
.send-btn{width:38px;height:38px;border-radius:50%;background:var(--tdd);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s}
.send-btn:hover{background:var(--teal)}
.send-btn svg{width:15px;height:15px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* DS-160 VIEW */
.ds-view{flex:1;display:none;overflow-y:auto;padding:1.25rem}
.ds-view.on{display:block}
.ds-card{background:var(--w);border-radius:10px;border:1px solid var(--brd);padding:1rem;margin-bottom:1rem}
.ds-card-title{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.07em;color:var(--ht);margin-bottom:10px}
.ds-fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:10px}
.ds-field label{font-size:11px;color:var(--mt);display:block;margin-bottom:3px}
.ds-val{font-size:13px;font-weight:500;padding:7px 10px;background:var(--bg);border-radius:6px;border:1px solid var(--brd);min-height:32px;line-height:1.4}
.ds-progress-card{background:var(--w);border-radius:10px;border:1px solid var(--brd);padding:1rem;margin-bottom:1rem;display:flex;align-items:center;gap:14px}
.ds-pct-num{font-size:32px;font-weight:500;color:var(--teal);flex-shrink:0;line-height:1}
.ds-bar-wrap{flex:1}
.ds-bar-wrap p{font-size:13px;font-weight:500;margin-bottom:2px}
.ds-bar-wrap small{font-size:11px;color:var(--mt)}
.ds-bar{height:6px;background:var(--bg);border-radius:3px;overflow:hidden;margin-top:6px}
.ds-bar-fill{height:100%;background:var(--teal);border-radius:3px;transition:width .5s}
.ds-pending{background:#FAEEDA;border-radius:10px;border:1px solid #BA7517;padding:1rem;margin-bottom:1rem}
.ds-pending-title{font-size:11px;font-weight:500;color:#BA7517;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.ds-pending-item{font-size:12px;color:var(--mt);padding:3px 0;border-bottom:1px solid rgba(186,117,23,.15)}
.ds-pending-item:last-child{border:none}

@media(max-width:560px){.sidebar{display:none}.ds-fields{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <img src="/public/logo.png" alt="Vía Global">
  <div class="nav-right" id="nav-right" style="display:none">

      </div>
    </div>
  </div>

  <!-- DS-160 VIEW -->
  <div class="ds-view" id="ds-view"></div>
</div>

// ─── STATE ────────────────────────────────────────────────────────
let caseId = null;
let caseVisa = 'turista';
let codigo = '';
let messages = [];
let dsData = {};
let loading = false;
let firstMsg = true;

// ─── HELPERS ──────────────────────────────────────────────────────
function getTime() {
  return new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

// ─── LOGIN ────────────────────────────────────────────────────────
async function doLogin() {
  const val = document.getElementById('code-inp').value.trim().toUpperCase();
  if (!val) return;
  try {
    const { data, error } = await db.from('casos').select('*').eq('codigo_cliente', val).single();
    if (error || !data) {
      document.getElementById('login-err').style.display = 'block';
      return;
    }
    caseId = data.id;
    caseVisa = data.visa || 'turista';
    codigo = val;
    messages = Array.isArray(data.historial) ? data.historial : [];
    dsData = (data.ds160 && typeof data.ds160 === 'object') ? data.ds160 : {};
    firstMsg = messages.length === 0;

    document.getElementById('login-err').style.display = 'none';
    document.getElementById('login-wrap').style.display = 'none';
    document.getElementById('app').classList.add('on');
    document.getElementById('nav-right').style.display = 'flex';
    document.getElementById('nav-code-val').textContent = val;

    renderAgent();
    renderMessages();
    renderQuickBtns();
  } catch (e) {
    document.getElementById('login-err').textContent = 'Error de conexión. Intenta de nuevo.';
    document.getElementById('login-err').style.display = 'block';
  }
}

function logout() {
  caseId = null; messages = []; dsData = {}; firstMsg = true; codigo = '';
  document.getElementById('login-wrap').style.display = 'flex';
  document.getElementById('app').classList.remove('on');
  document.getElementById('nav-right').style.display = 'none';
  document.getElementById('code-inp').value = '';
  showTab('chat');
}

// ─── TABS ─────────────────────────────────────────────────────────
function showTab(t) {
  document.querySelectorAll('.tab').forEach((el, i) => {
    el.classList.toggle('on', ['chat', 'ds160'][i] === t);
  });
  document.getElementById('chat-view').classList.toggle('on', t === 'chat');
  document.getElementById('ds-view').classList.toggle('on', t === 'ds160');
  if (t === 'ds160') renderDS160();
}

// ─── AGENT RENDER ─────────────────────────────────────────────────
function renderAgent() {
  const a = AGENTS[caseVisa];

  // Header
  document.getElementById('chat-hdr').innerHTML = `
    <div class="agent-av" style="background:${a.bg}">${a.emoji}</div>
    <div class="agent-info">
      <p>${a.fullName}</p>
      <small>
        <span style="width:6px;height:6px;border-radius:50%;background:#4ade80;display:inline-block"></span>
        En línea · ${a.desc}
      </small>
    </div>
    <span class="saved-ind" id="saved-ind">☁ Guardado</span>`;

  // Sidebar
  document.getElementById('sidebar').innerHTML = `
    <div class="sb-sec">
      <div class="sb-lbl">Estado de tu trámite</div>
      ${a.status.map((s, i) => `
        <div class="step ${i === 0 ? 'cur' : ''}">
          <div class="step-dot"></div>
          <span>${s}</span>
        </div>`).join('')}
    </div>
    <div class="sb-sec" style="flex:1">
      <div class="sb-lbl">Documentos requeridos</div>
      ${a.checklist.map(c => `
        <div class="doc">
          <div class="doc-box"></div>
          <span>${c}</span>
        </div>`).join('')}
    </div>`;
}

function renderMessages() {
  const a = AGENTS[caseVisa];
  const c = document.getElementById('messages');
  if (!messages.length) {
    c.innerHTML = `<div style="text-align:center;padding:3rem 1rem;color:var(--ht)">
      <p style="font-size:12px">Envía un mensaje para comenzar</p>
    </div>`;
    return;
  }
  c.innerHTML = messages.map(m => {
    const clean = (m.content || '').replace(/<DS160>[\s\S]*?<\/DS160>/g, '').trim();
    const time = m.time || '';
    if (m.role === 'assistant') {
      return `<div class="msg agent">
        <div class="msg-av" style="background:${a.bg}">${a.emoji}</div>
        <div>
          <div class="bubble">${formatText(clean)}</div>
          <div class="msg-time">${time}</div>
        </div>
      </div>`;
    }
    return `<div class="msg user">
      <div>
        <div class="bubble">${clean}</div>
        <div class="msg-time">${time}</div>
      </div>
    </div>`;
  }).join('');
  c.scrollTop = c.scrollHeight;
}

function renderQuickBtns() {
  const a = AGENTS[caseVisa];
  document.getElementById('quick-btns').innerHTML = a.quickBtns
    .map(q => `<button class="qbtn" onclick="sendQuick('${q}')">${q}</button>`)
    .join('');
}

function formatText(t) {
  return t
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/^- (.+)$/gm, '<li>$1</li>')
    .replace(/(<li>[\s\S]*?<\/li>)/g, '<ul>$1</ul>')
    .replace(/\n\n/g, '<br><br>')
    .replace(/\n/g, '<br>');
}

// ─── SEND MESSAGE ─────────────────────────────────────────────────
async function sendQuick(t) {
  document.getElementById('msg-inp').value = t;
  await doSend();
}

async function doSend() {
  const inp = document.getElementById('msg-inp');
  const text = inp.value.trim();
  if (!text || loading) return;

  inp.value = '';
  inp.style.height = 'auto';
  loading = true;

  // Add user message
  messages.push({ role: 'user', content: text, time: getTime() });
  renderMessages();

  // Save immediately
  await saveData();

  // First message — show connect note
  if (firstMsg) {
    firstMsg = false;
    const note = document.createElement('div');
    note.className = 'sys-note';
    note.textContent = AGENTS[caseVisa].connectMsg;
    document.getElementById('messages').appendChild(note);
  }

  // Show typing with human delay
  const typingId = showTyping();
  await sleep(8000 + Math.random() * 10000);

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        system: AGENTS[caseVisa].prompt,
        messages: messages.map(m => ({ role: m.role, content: m.content }))
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Error');

    const reply = data.text || 'Sin respuesta.';
    removeTyping(typingId);
    parseDS160(reply);
    messages.push({ role: 'assistant', content: reply, time: getTime() });
    renderMessages();
    await saveData();

  } catch (e) {
    removeTyping(typingId);
    messages.push({ role: 'assistant', content: 'Perdona, tuve un problemita 😅 ¿Me repites?', time: getTime() });
    renderMessages();
  }

  loading = false;
}

function showTyping() {
  const id = 'typ-' + Date.now();
  const a = AGENTS[caseVisa];
  const d = document.createElement('div');
  d.className = 'typing-row';
  d.id = id;
  d.innerHTML = `
    <div class="msg-av" style="background:${a.bg}">${a.emoji}</div>
    <div class="typing-bub">
      <span></span><span></span><span></span>
    </div>`;
  const c = document.getElementById('messages');
  c.appendChild(d);
  c.scrollTop = c.scrollHeight;
  return id;
}

function removeTyping(id) {
  document.getElementById(id)?.remove();
}

// ─── DS-160 PARSING ───────────────────────────────────────────────
function parseDS160(text) {
  const m = text.match(/<DS160>([\s\S]*?)<\/DS160>/);
  if (!m) return;
  try {
    const parsed = JSON.parse(m[1]);
    Object.entries(parsed).forEach(([k, v]) => {
      if (v && v !== '') dsData[k] = v;
    });
  } catch (e) {}
}

// ─── SAVE ─────────────────────────────────────────────────────────
async function saveData() {
  if (!caseId) return;
  try {
    const filled = REQUIRED_FIELDS.filter(k => dsData[k] && dsData[k] !== '').length;
    const pct = Math.min(100, Math.round((filled / REQUIRED_FIELDS.length) * 100));

    const { data: caso } = await db.from('casos')
      .update({ historial: messages, ds160: dsData, ds160_pct: pct })
      .eq('id', caseId)
      .select()
      .single();

    // Flash saved indicator
    const ind = document.getElementById('saved-ind');
    if (ind) { ind.classList.add('on'); setTimeout(() => ind.classList.remove('on'), 2000); }

    // Send email when 100% complete
    if (pct >= 100 && caso && !caso.notificado) {
      await db.from('casos').update({ notificado: true }).eq('id', caseId);
      await fetch('/api/notify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          clienteNombre: dsData.nombre && dsData.apellido
            ? dsData.nombre + ' ' + dsData.apellido
            : caso.nombre || 'Cliente',
          visa: caseVisa,
          codigo: codigo
        })
      });
    }
  } catch (e) {
    console.error('Save error:', e);
  }
}

// ─── DS-160 RENDER ────────────────────────────────────────────────
function renderDS160() {
  const data = dsData || {};
  const filled = REQUIRED_FIELDS.filter(k => data[k] && data[k] !== '').length;
  const pct = Math.min(100, Math.round((filled / REQUIRED_FIELDS.length) * 100));

  const missing = REQUIRED_FIELDS
    .filter(k => !data[k] || data[k] === '')
    .map(k => {
      for (const sec of DS_SECTIONS) {
        const f = sec.fields.find(f => f.k === k);
        if (f) return f.l;
      }
      return k;
    });

  let html = `
    <div class="ds-progress-card">
      <div class="ds-pct-num">${pct}%</div>
      <div class="ds-bar-wrap">
        <p>Tu formulario DS-160</p>
        <small>${filled} de ${REQUIRED_FIELDS.length} campos completados</small>
        <div class="ds-bar">
          <div class="ds-bar-fill" style="width:${pct}%"></div>
        </div>
      </div>
    </div>`;

  if (missing.length) {
    html += `
      <div class="ds-pending">
        <div class="ds-pending-title">⚠️ Campos pendientes — coméntaselos a tu asesor</div>
        ${missing.map(l => `<div class="ds-pending-item">• ${l}</div>`).join('')}
      </div>`;
  }

  DS_SECTIONS.forEach(sec => {
    const visible = sec.fields.filter(f => data[f.k] && data[f.k] !== '');
    if (!visible.length) return;
    html += `
      <div class="ds-card">
        <div class="ds-card-title">📋 ${sec.title}</div>
        <div class="ds-fields">
          ${visible.map(f => `
            <div class="ds-field">
              <label>${f.l}</label>
              <div class="ds-val">${data[f.k]}</div>
            </div>`).join('')}
        </div>
      </div>`;
  });

  if (!filled) {
    html += `<div style="text-align:center;padding:2rem;color:var(--mt);background:var(--w);border-radius:10px;border:1px dashed var(--brd2);font-size:13px">
      Chatea con tu asesor para que aparezcan tus datos aquí.
    </div>`;
  }

  document.getElementById('ds-view').innerHTML = html;
}
</script>
</body>
</html>
