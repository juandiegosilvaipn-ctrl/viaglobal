<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vía Global — Portal del Cliente</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--teal:#1D9E75;--td:#0F6E56;--tdd:#085041;--tl:#E1F5EE;--gold:#BA7517;--gl:#FAEEDA;--bg:#f4f3ef;--w:#fff;--brd:#e2e0da;--brd2:#cbc8bf;--tx:#1a1a18;--mt:#6b6a66;--ht:#a8a6a0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;display:flex;flex-direction:column;font-size:14px}
nav{background:var(--tdd);padding:.7rem 1.25rem;display:flex;align-items:center;gap:12px;flex-shrink:0}
nav img{height:36px;width:auto;filter:brightness(0) invert(1)}
.nav-user{margin-left:auto;font-size:12px;color:rgba(255,255,255,.6);display:flex;align-items:center;gap:8px}
.nav-user span{color:#fff;font-weight:500}
.logout-btn{padding:4px 10px;border:1px solid rgba(255,255,255,.2);border-radius:6px;background:transparent;color:rgba(255,255,255,.7);font-family:'DM Sans',sans-serif;font-size:11px;cursor:pointer}
.logout-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.login-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:2rem}
.login-card{background:var(--w);border-radius:16px;border:1px solid var(--brd);padding:2rem;width:100%;max-width:380px;text-align:center}
.login-card img{height:55px;width:auto;margin-bottom:1.25rem}
.login-card h2{font-family:'DM Serif Display',serif;font-size:22px;font-weight:400;margin-bottom:6px}
.login-card p{font-size:13px;color:var(--mt);margin-bottom:1.5rem;line-height:1.5}
.login-input{width:100%;padding:11px 14px;border:1px solid var(--brd);border-radius:9px;font-family:'DM Sans',sans-serif;font-size:15px;color:var(--tx);outline:none;text-align:center;letter-spacing:.1em;text-transform:uppercase;transition:border-color .2s;margin-bottom:10px}
.login-input:focus{border-color:var(--teal)}
.login-btn{width:100%;padding:12px;background:var(--tdd);color:#fff;border:none;border-radius:9px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:background .15s}
.login-btn:hover{background:var(--td)}
.login-error{font-size:12px;color:#E24B4A;margin-top:8px;display:none}
.app-wrap{flex:1;display:none;flex-direction:column;min-height:0;overflow:hidden}
.app-wrap.active{display:flex}
.tabs{background:var(--tdd);display:flex;padding:0 1.25rem;border-top:1px solid rgba(255,255,255,.06)}
.tab{padding:0 1rem;height:46px;display:flex;align-items:center;font-size:13px;color:rgba(255,255,255,.55);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap;gap:6px}
.tab:hover{color:rgba(255,255,255,.85)}
.tab.active{color:#fff;border-bottom-color:#fff}
.abar{background:var(--tdd);padding:.55rem 1.25rem;border-top:1px solid rgba(255,255,255,.05);display:flex;align-items:center;gap:8px;flex-shrink:0}
.abar-lbl{font-size:10px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.07em;margin-right:4px}
.atab{padding:4px 12px;border-radius:14px;border:1px solid rgba(255,255,255,.18);background:transparent;color:rgba(255,255,255,.6);font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;transition:all .18s}
.atab:hover{background:rgba(255,255,255,.1);color:#fff}
.atab.active{background:#fff;color:var(--tdd);font-weight:500;border-color:#fff}
.chat-page{flex:1;display:none;flex-direction:column;min-height:0;overflow:hidden}
.chat-page.active{display:flex}
.amain{display:flex;flex:1;min-height:0;overflow:hidden}
.sb{width:220px;background:var(--w);border-right:1px solid var(--brd);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
.sbs{padding:.8rem 1rem;border-bottom:1px solid var(--brd)}
.sbl{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.07em;color:var(--ht);margin-bottom:8px}
.sst{display:flex;align-items:center;gap:7px;padding:4px 0;font-size:12px;color:var(--mt)}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--brd2);flex-shrink:0}
.sst.done .sdot{background:var(--teal)}
.sst.cur{color:var(--tx);font-weight:500}
.sst.cur .sdot{background:var(--gold)}
.cli{display:flex;align-items:flex-start;gap:7px;padding:5px 0;font-size:12px;border-bottom:1px solid var(--brd)}
.cli:last-child{border:none}
.clb{width:14px;height:14px;border:1.5px solid var(--brd2);border-radius:3px;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center}
.cli.done .clb{background:var(--teal);border-color:var(--teal)}
.cli.done .clb::after{content:'✓';color:#fff;font-size:9px}
.cli.done span{color:var(--ht);text-decoration:line-through}
.ccol{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.chdr{padding:.75rem 1.25rem;background:var(--w);border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:10px}
.aav{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.chi p{font-size:13px;font-weight:500}
.chi small{font-size:11px;color:var(--mt)}
.svi{margin-left:auto;font-size:11px;color:var(--teal);opacity:0;transition:opacity .3s}
.svi.on{opacity:1}
.msgs{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px;max-width:88%;animation:mIn .2s ease}
@keyframes mIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.msg.ag{align-self:flex-start}
.msg.us{align-self:flex-end;flex-direction:row-reverse}
.mav{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;margin-top:2px}
.mb{padding:9px 13px;border-radius:11px;font-size:13px;line-height:1.55}
.msg.ag .mb{background:var(--w);border:1px solid var(--brd);border-radius:3px 11px 11px 11px}
.msg.us .mb{background:var(--tdd);color:#fff;border-radius:11px 3px 11px 11px}
.mb ul{padding-left:1.1rem;margin-top:3px}
.mb li{margin-bottom:2px}
.tdots{display:flex;gap:3px;align-items:center;padding:10px 13px}
.tdots span{width:5px;height:5px;border-radius:50%;background:var(--ht);animation:tda 1.2s infinite}
.tdots span:nth-child(2){animation-delay:.2s}
.tdots span:nth-child(3){animation-delay:.4s}
@keyframes tda{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-4px)}}
.qabar{padding:.5rem 1rem;display:flex;gap:5px;flex-wrap:wrap;border-top:1px solid var(--brd);background:var(--bg)}
.qa{padding:4px 11px;border:1px solid var(--brd2);border-radius:14px;background:var(--w);font-family:'DM Sans',sans-serif;font-size:11px;color:var(--mt);cursor:pointer;transition:all .15s;white-space:nowrap}
.qa:hover{border-color:var(--teal);color:var(--td);background:var(--tl)}
.inprow{padding:.75rem 1rem;background:var(--w);border-top:1px solid var(--brd);display:flex;gap:7px;align-items:flex-end}
.inprow textarea{flex:1;padding:9px 13px;border:1px solid var(--brd);border-radius:9px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--tx);resize:none;outline:none;max-height:110px;line-height:1.5;transition:border-color .2s}
.inprow textarea:focus{border-color:var(--teal)}
.sndbtn{width:36px;height:36px;border-radius:9px;background:var(--td);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s}
.sndbtn:hover{background:var(--teal)}
.sndbtn svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ds-page{flex:1;display:none;overflow-y:auto;padding:1.25rem}
.ds-page.active{display:block}
.ds-section{background:var(--w);border-radius:10px;border:1px solid var(--brd);padding:1rem;margin-bottom:1rem}
.ds-sec-title{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.07em;color:var(--ht);margin-bottom:10px}
.ds-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.ds-field label{font-size:11px;color:var(--mt);display:block;margin-bottom:3px}
.dsv{font-size:13px;font-weight:500;padding:7px 10px;background:var(--bg);border-radius:6px;border:1px solid var(--brd);min-height:32px;line-height:1.4}
.ds-progress{background:var(--w);border-radius:10px;border:1px solid var(--brd);padding:1rem;margin-bottom:1rem;display:flex;align-items:center;gap:12px}
.ds-pct{font-size:28px;font-weight:500;color:var(--teal);flex-shrink:0}
.ds-bar-wrap{flex:1}
.ds-bar{height:6px;background:var(--bg);border-radius:3px;overflow:hidden;margin-top:6px}
.ds-bar-fill{height:100%;background:var(--teal);border-radius:3px;transition:width .4s}
@media(max-width:580px){.sb{display:none}.ds-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav>
  <img src="/public/logo.png" alt="Vía Global">
  <div class="nav-user" id="nav-user" style="display:none">
    Código: <span id="nav-codigo"></span>
    <button class="logout-btn" onclick="logout()">Salir</button>
  </div>
</nav>

<div class="login-wrap" id="login-wrap">
  <div class="login-card">
    <img src="/public/logo.png" alt="Vía Global">
    <h2>Bienvenido</h2>
    <p>Ingresa tu código de cliente para acceder a tu trámite de visa.</p>
    <input class="login-input" id="codigo-input" type="text" placeholder="VG-2024-001" maxlength="20" oninput="this.value=this.value.toUpperCase()">
    <button class="login-btn" onclick="login()">Acceder</button>
    <div class="login-error" id="login-error">Código no válido. Verifica con tu gestor.</div>
  </div>
</div>

<div class="app-wrap" id="app-wrap">
  <div class="tabs">
    <div class="tab active" onclick="showTab('chat')">💬 Mi asesor</div>
    <div class="tab" onclick="showTab('ds160')">📋 Mi DS-160</div>
  </div>
  <div class="abar" id="abar">
    <span class="abar-lbl">Tipo de visa</span>
    <button class="atab active" onclick="swAgent('turista')">✈ Turista B1/B2</button>
    <button class="atab" onclick="swAgent('tn')">💼 Visa TN</button>
    <button class="atab" onclick="swAgent('td')">👨‍👩‍👧 Visa TD</button>
  </div>
  <div class="chat-page active" id="chat-page">
    <div class="amain">
      <div class="sb" id="sb"></div>
      <div class="ccol">
        <div class="chdr" id="chdr"></div>
        <div class="msgs" id="msgs"></div>
        <div class="qabar" id="qabar"></div>
        <div class="inprow">
          <textarea id="inp" rows="1" placeholder="Escribe tu pregunta..." onkeydown="hk(event)" oninput="ar(this)"></textarea>
          <button class="sndbtn" onclick="snd()">
            <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>
  <div class="ds-page" id="ds160-page"></div>
</div>

<script>
const SUPA_URL='https://mrmphgiqojbzgzcqogui.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1ybXBoZ2lxb2piemd6Y3FvZ3VpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0MzM5ODUsImV4cCI6MjA5NTAwOTk4NX0.AErFjZkcCw2inqnlvziF_ozfpXJ4o1SLZwonmTzUNQs';
const {createClient}=supabase;
const db=createClient(SUPA_URL,SUPA_KEY);

const AGENTS={
  turista:{name:'Asesor Turista B1/B2',emoji:'✈',bg:'#E1F5EE',desc:'Especialista en visa de turista',
    checklist:['Pasaporte vigente (+6 meses)','Pasaporte anterior','Foto fondo blanco','Acta de nacimiento','Carta laboral con sueldo','Estados de cuenta 3 meses','Comprobante de domicilio','Escrituras / propiedad','Actas matrimonio/hijos','Itinerario o vuelo','Reserva de hotel','Carta de invitación','DS-160 completado','Pago MRV fee','Cita consular agendada'],
    status:['Evaluación aprobada','Contrato firmado','Documentos recopilados','DS-160 completado','MRV pagado','Cita agendada','Entrevista realizada','Visa aprobada'],
    qa:['¿Qué documentos necesito?','¿Cuánto tarda el proceso?','¿Cómo es la entrevista?','¿Cuánto dinero necesito mostrar?'],
    prompt:`Eres el asesor de Vía Global, gestoría de visas. Hablas directamente con el CLIENTE que quiere tramitar su visa B1/B2. Sé amable, claro y tranquilizador. Cuando el cliente te dé datos personales, extráelos al final:\n<DS160>{"apellido":"","nombre":"","fecha_nac":"","lugar_nac":"","nacionalidad":"Mexico","estado_civil":"","direccion":"","telefono":"","email":"","pasaporte_num":"","pasaporte_exp":"","ocupacion":"","empleador":"","salario":"","motivo_viaje":"","destino_usa":"","duracion_estancia":"","contacto_usa":"","ha_viajado_usa":"","visa_previa":"","visa_rechazada":"No","antecedentes":"No"}</DS160>\nHabla en español de México.`},
  tn:{name:'Asesor Visa TN',emoji:'💼',bg:'#E6F1FB',desc:'Especialista en visa TN — T-MEC',
    checklist:['Pasaporte vigente','Foto fondo blanco','Título universitario','Cédula profesional','CV en inglés','Certificaciones','Carta oferta empleador USA','Descripción del puesto','EIN del empleador','Profesión verificada T-MEC','DS-160 completado','Pago MRV fee','Cita consular agendada'],
    status:['Evaluación aprobada','Profesión verificada T-MEC','Carta oferta validada','Contrato firmado','Documentos recopilados','DS-160 completado','MRV pagado','Cita agendada','Entrevista realizada','Visa aprobada'],
    qa:['¿Qué es la visa TN?','¿Mi profesión califica?','¿Qué debe decir la carta oferta?','¿Cuánto tarda el proceso?'],
    prompt:`Eres el asesor de Vía Global. Hablas con el CLIENTE que quiere tramitar su visa TN. Cuando te dé datos:\n<DS160>{"apellido":"","nombre":"","fecha_nac":"","lugar_nac":"","nacionalidad":"Mexico","estado_civil":"","direccion":"","telefono":"","email":"","pasaporte_num":"","pasaporte_exp":"","ocupacion":"","empleador":"","salario":"","empleador_usa":"","puesto_usa":"","salario_usa":"","profesion_tmec":"","motivo_viaje":"Trabajo temporal TN","destino_usa":"","duracion_estancia":"","contacto_usa":"","ha_viajado_usa":"","visa_previa":"","visa_rechazada":"No","antecedentes":"No"}</DS160>\nHabla en español de México.`},
  td:{name:'Asesor Visa TD',emoji:'👨‍👩‍👧',bg:'#EEEDFE',desc:'Especialista en visa TD — dependientes',
    checklist:['Pasaporte del dependiente','Foto fondo blanco','Acta de nacimiento','Acta de matrimonio','Acta de nacimiento del titular','Copia de visa TN del titular','Carta de empleo del titular','DS-160','Pago MRV fee','Cita conjunta con titular'],
    status:['TN del titular verificado','Vínculo familiar documentado','Contrato firmado','Documentos recopilados','DS-160 completado','MRV pagado','Cita agendada','Entrevista realizada','Visa aprobada'],
    qa:['¿Qué es la visa TD?','¿Qué documentos necesito?','¿Puedo trabajar con visa TD?','¿La cita es con mi familiar?'],
    prompt:`Eres el asesor de Vía Global. Hablas con el CLIENTE que quiere tramitar su visa TD. Cuando te dé datos:\n<DS160>{"apellido":"","nombre":"","fecha_nac":"","lugar_nac":"","nacionalidad":"Mexico","estado_civil":"","relacion_titular":"","direccion":"","telefono":"","email":"","pasaporte_num":"","pasaporte_exp":"","titular_nombre":"","titular_visa":"","motivo_viaje":"Acompañar titular TN","destino_usa":"","duracion_estancia":"","ha_viajado_usa":"","visa_previa":"","visa_rechazada":"No","antecedentes":"No"}</DS160>\nAclara que la visa TD no da derecho a trabajar. Habla en español de México.`}
};

const DS_SECS=[
  {t:'Datos personales',f:[{k:'apellido',l:'Apellido(s)'},{k:'nombre',l:'Nombre(s)'},{k:'fecha_nac',l:'Fecha de nacimiento'},{k:'lugar_nac',l:'Lugar de nacimiento'},{k:'nacionalidad',l:'Nacionalidad'},{k:'estado_civil',l:'Estado civil'}]},
  {t:'Contacto',f:[{k:'direccion',l:'Dirección'},{k:'telefono',l:'Teléfono'},{k:'email',l:'Correo electrónico'}]},
  {t:'Pasaporte',f:[{k:'pasaporte_num',l:'Número de pasaporte'},{k:'pasaporte_exp',l:'Fecha de vencimiento'}]},
  {t:'Empleo',f:[{k:'ocupacion',l:'Ocupación'},{k:'empleador',l:'Empleador en México'},{k:'salario',l:'Salario mensual'},{k:'empleador_usa',l:'Empleador en EE.UU.'},{k:'puesto_usa',l:'Puesto en EE.UU.'},{k:'salario_usa',l:'Salario en EE.UU.'},{k:'profesion_tmec',l:'Profesión T-MEC'}]},
  {t:'Viaje',f:[{k:'motivo_viaje',l:'Propósito del viaje'},{k:'destino_usa',l:'Destino en EE.UU.'},{k:'duracion_estancia',l:'Duración de estancia'},{k:'contacto_usa',l:'Contacto en EE.UU.'}]},
  {t:'Historial migratorio',f:[{k:'ha_viajado_usa',l:'Ha visitado EE.UU.'},{k:'visa_previa',l:'Visa americana previa'},{k:'visa_rechazada',l:'Visa rechazada antes'},{k:'antecedentes',l:'Antecedentes penales'},{k:'relacion_titular',l:'Relación con titular TN'},{k:'titular_nombre',l:'Nombre titular TN'},{k:'titular_visa',l:'Visa TN del titular'}]}
];

let ca='turista',hist={turista:[],tn:[],td:[]},cid=null,dsData={},loading=false;

async function login(){
  const codigo=document.getElementById('codigo-input').value.trim().toUpperCase();
  if(!codigo){showError('Ingresa tu código.');return;}
  const {data,error}=await db.from('casos').select('*').eq('codigo_cliente',codigo).single();
  if(error||!data){showError('Código no válido. Verifica con tu gestor.');return;}
  cid=data.id;ca=data.visa||'turista';
  hist[ca]=data.historial||[];dsData=data.ds160||{};
  document.getElementById('login-error').style.display='none';
  document.getElementById('login-wrap').style.display='none';
  document.getElementById('app-wrap').classList.add('active');
  document.getElementById('nav-user').style.display='flex';
  document.getElementById('nav-codigo').textContent=codigo;
  swAgent(ca);
}

function showError(msg){const el=document.getElementById('login-error');el.textContent=msg;el.style.display='block';}

function logout(){
  cid=null;hist={turista:[],tn:[],td:[]};dsData={};
  document.getElementById('login-wrap').style.display='flex';
  document.getElementById('app-wrap').classList.remove('active');
  document.getElementById('nav-user').style.display='none';
  document.getElementById('codigo-input').value='';
}

function showTab(t){
  document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('active',['chat','ds160'][i]===t));
  document.getElementById('chat-page').classList.toggle('active',t==='chat');
  document.getElementById('ds160-page').classList.toggle('active',t==='ds160');
  document.getElementById('abar').style.display=t==='chat'?'flex':'none';
  if(t==='ds160')renderDS160();
}

function swAgent(a){
  ca=a;
  document.querySelectorAll('.atab').forEach((t,i)=>t.classList.toggle('active',['turista','tn','td'][i]===a));
  rsb();rchdr();rmsgs();rqa();
}

function rchdr(){
  const a=AGENTS[ca];
  document.getElementById('chdr').innerHTML=`<div class="aav" style="background:${a.bg}">${a.emoji}</div><div class="chi"><p>${a.name}</p><small>${a.desc}</small></div><span class="svi" id="svi">☁ Guardado</span>`;
}

function rsb(){
  const a=AGENTS[ca];
  document.getElementById('sb').innerHTML=`
    <div class="sbs"><div class="sbl">Estado de tu trámite</div>
    ${a.status.map((s,i)=>`<div class="sst ${i===0?'cur':''}"><div class="sdot"></div><span>${s}</span></div>`).join('')}</div>
    <div class="sbs" style="flex:1"><div class="sbl">Documentos requeridos</div>
    ${a.checklist.map(c=>`<div class="cli"><div class="clb"></div><span>${c}</span></div>`).join('')}</div>`;
}

function fmt(t){
  return t.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/^- (.+)$/gm,'<li>$1</li>')
    .replace(/(<li>[\s\S]*?<\/li>)/g,'<ul>$1</ul>')
    .replace(/\n\n/g,'<br><br>').replace(/\n/g,'<br>');
}

function rmsgs(){
  const m=hist[ca],c=document.getElementById('msgs');
  if(!m.length){
    const a=AGENTS[ca];
    c.innerHTML=`<div style="text-align:center;padding:2rem 1rem;color:var(--mt)">
      <div style="font-size:30px;margin-bottom:8px">${a.emoji}</div>
      <p style="font-size:14px;font-weight:500;color:var(--tx);margin-bottom:4px">Hola, soy tu ${a.name}</p>
      <p style="font-size:12px">Estoy aquí para guiarte en tu trámite. ¿Por dónde quieres empezar?</p></div>`;return;
  }
  c.innerHTML=m.map(msg=>{
    const clean=msg.content.replace(/<DS160>[\s\S]*?<\/DS160>/g,'').trim();
    if(msg.role==='assistant'){const a=AGENTS[ca];return `<div class="msg ag"><div class="mav" style="background:${a.bg}">${a.emoji}</div><div class="mb">${fmt(clean)}</div></div>`;}
    return `<div class="msg us"><div class="mav" style="background:#eae8e2">👤</div><div class="mb">${clean}</div></div>`;
  }).join('');
  c.scrollTop=c.scrollHeight;
}

function rqa(){document.getElementById('qabar').innerHTML=AGENTS[ca].qa.map(q=>`<button class="qa" onclick="sendQ('${q}')">${q}</button>`).join('');}

async function sendQ(t){document.getElementById('inp').value=t;await snd();}

async function snd(){
  const inp=document.getElementById('inp');const text=inp.value.trim();
  if(!text||loading)return;
  inp.value='';inp.style.height='auto';
  const k=ca;hist[k].push({role:'user',content:text});rmsgs();
  const tid=shtyp();loading=true;
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({system:AGENTS[k].prompt,messages:hist[k].map(m=>({role:m.role,content:m.content}))})});
    const data=await r.json();
    if(!r.ok)throw new Error(data.error||'Error');
    const reply=data.text||'Sin respuesta.';
    rmtyp(tid);hist[k].push({role:'assistant',content:reply});parseDS(reply);rmsgs();await asave();
  }catch(e){rmtyp(tid);hist[k].push({role:'assistant',content:'Hubo un error. Intenta de nuevo.'});rmsgs();}
  loading=false;
}

function shtyp(){
  const id='t'+Date.now(),a=AGENTS[ca];
  const d=document.createElement('div');d.className='msg ag';d.id=id;
  d.innerHTML=`<div class="mav" style="background:${a.bg}">${a.emoji}</div><div class="mb"><div class="tdots"><span></span><span></span><span></span></div></div>`;
  const c=document.getElementById('msgs');c.appendChild(d);c.scrollTop=c.scrollHeight;return id;
}
function rmtyp(id){document.getElementById(id)?.remove();}
function hk(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();snd();}}
function ar(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,110)+'px';}

function parseDS(text){
  const m=text.match(/<DS160>([\s\S]*?)<\/DS160>/);
  if(!m)return;
  try{const p=JSON.parse(m[1]);Object.entries(p).forEach(([k,v])=>{if(v&&v!=='')dsData[k]=v;});}catch(e){}
}

async function asave(){
  if(!cid)return;
  const filled=Object.values(dsData).filter(v=>v).length;
  await db.from('casos').update({historial:hist[ca],ds160:dsData,ds160_pct:Math.min(100,Math.round((filled/20)*100))}).eq('id',cid);
  const sv=document.getElementById('svi');if(sv){sv.classList.add('on');setTimeout(()=>sv.classList.remove('on'),1800);}
}

function renderDS160(){
  const data=dsData||{};
  const filled=Object.values(data).filter(v=>v).length;
  const pct=Math.min(100,Math.round((filled/20)*100));
  let html=`<div class="ds-progress"><div class="ds-pct">${pct}%</div><div class="ds-bar-wrap"><p style="font-size:13px;font-weight:500">Tu formulario DS-160</p><p style="font-size:12px;color:var(--mt);margin-top:2px">${filled} campos completados — sigue chateando con tu asesor para completarlo</p><div class="ds-bar"><div class="ds-bar-fill" style="width:${pct}%"></div></div></div></div>`;
  DS_SECS.forEach(sec=>{
    const vf=sec.f.filter(f=>data[f.k]);if(!vf.length)return;
    html+=`<div class="ds-section"><div class="ds-sec-title">📋 ${sec.t}</div><div class="ds-grid">`;
    vf.forEach(f=>{html+=`<div class="ds-field"><label>${f.l}</label><div class="dsv">${data[f.k]}</div></div>`;});
    html+='</div></div>';
  });
  if(!filled)html+=`<div style="text-align:center;padding:2rem;color:var(--mt);background:var(--w);border-radius:10px;border:1px dashed var(--brd2);font-size:13px">Chatea con tu asesor para que aparezcan tus datos aquí.</div>`;
  document.getElementById('ds160-page').innerHTML=html;
}

document.getElementById('codigo-input').addEventListener('keydown',e=>{if(e.key==='Enter')login();});
</script>
</body>
</html>
